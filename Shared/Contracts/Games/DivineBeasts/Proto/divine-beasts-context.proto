syntax = "proto3";

package divinebeasts.context.v1;

option go_package = "divinebeasts/backend/generated/proto/shared/divinebeasts/context/v1;contextv1";

// DivineBeastsRuntimeContext（神兽联盟运行上下文）保存项目专属Experience/ArenaMode语义。
// 大厅使用Experience.OpenWorld.Hub并由GameServer.Role.OpenWorld承载；历史Experience.Lobby.Main仅兼容映射到OpenWorld。
message DivineBeastsRuntimeContext {
  string experience_id = 1;
  string arena_mode_id = 2;
  string map_id = 3;
}
