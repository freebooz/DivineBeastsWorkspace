openapi: 3.1.0
info:
  title: 游戏平台身份服务内部接口（Identity API）
  version: 1.0.0
  description: |
    IdentityService（身份服务）当前已注册的内部 HTTP 路由，仅供 GatewayService（统一接入服务）或其他可信后端调用；不得通过公网 Ingress、游戏客户端或 UE 客户端直接暴露。
    生产装配使用 PostgreSQL 保存密码账号与会话；内存 guest 身份仅为旧开发构造器保留。当前内部 HTTP 明文传输没有服务间认证，不构成公网或生产安全边界。
servers:
  - url: http://127.0.0.1:8081
    description: 本地 Docker 开发部署的 IdentityService
tags:
  - name: 运维
    description: 检查服务进程存活、服务宿主就绪和版本信息；不代表身份数据库或业务依赖均可用。
  - name: 内部身份
    description: 供 GatewayService 或可信后端调用的身份操作，包括会话创建、令牌验证、刷新和撤销。
paths:
  /internal/v1/identity/probe:
    get:
      tags: [内部身份]
      operationId: probeIdentityInternal
      summary: 检查身份仓储与数据库的真实可用性
      responses:
        '200':
          description: 领域 Probe 成功，不能用宿主 health/ready 替代。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/identity/refresh:
    post:
      tags: [内部身份]
      operationId: refreshIdentityInternal
      summary: 原子轮换刷新令牌且不延长会话期限
      description: 不可自动重试；响应丢失也可能已消费旧令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: 新令牌对与原刷新绝对期限。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalLoginResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/identity/logout:
    post:
      tags: [内部身份]
      operationId: logoutIdentityInternal
      summary: 使用刷新令牌幂等撤销所属会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204': { description: 会话已撤销，无正文。 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /health/live:
    get:
      tags: [运维]
      operationId: getIdentityLiveness
      summary: 查询身份服务进程存活状态
      responses:
        '200':
          description: 服务进程存活。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessResponse' }
  /health/ready:
    get:
      tags: [运维]
      operationId: getIdentityReadiness
      summary: 查询身份服务宿主就绪状态
      responses:
        '200':
          description: 服务宿主已就绪。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
  /version:
    get:
      tags: [运维]
      operationId: getIdentityVersion
      summary: 查询身份服务名称与版本
      responses:
        '200':
          description: 服务名称与运行版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /internal/v1/identity/login:
    post:
      tags: [内部身份]
      operationId: loginIdentityInternal
      summary: 为统一接入服务创建玩家会话
      description: password 提供方使用 accountName 传入账号名、credential 传入密码；生产环境拒绝 guest，且不会回退到内存身份。请求正文上限为 64 KiB；未知字段、重复字段或缺少必填字段均会被拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalLoginRequest' }
      responses:
        '200':
          description: 会话创建成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalLoginResponse' }
        '400':
          description: JSON 格式错误、未知字段或不支持的提供方。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalApiError' }
        '401':
          description: 身份服务拒绝登录请求。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalApiError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/identity/authenticate:
    post:
      tags: [内部身份]
      operationId: authenticateIdentityInternal
      summary: 验证访问令牌（Access Token）
      description: 无效令牌保留 HTTP 200 与 valid=false 兼容语义；后端不可用必须返回 503，不能伪装为令牌无效。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticateRequest' }
      responses:
        '200':
          description: 返回令牌验证结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticateResponse' }
        '400':
          description: JSON 格式错误或包含未知字段。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalApiError' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  responses:
    InvalidRequest:
      description: 必填字段、大小或 JSON 校验失败。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
    Unauthorized:
      description: 凭据错误、令牌无效或已过期。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
    Unavailable:
      description: 领域或数据库不可用，不泄露连接及凭据信息。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
  schemas:
    ProbeResponse:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready: { type: boolean, const: true, description: 真实数据库探测通过。 }
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, description: 只用于刷新或撤销，不可写日志。 }
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok, description: 存活状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ready, description: 就绪状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [service, version]
      properties:
        service: { type: string, description: 服务运行名称。 }
        version: { type: string, description: 服务构建版本。 }
    InternalLoginRequest:
      type: object
      additionalProperties: false
      required: [gameId, provider, credential]
      properties:
        gameId: { type: string, minLength: 1, description: 游戏逻辑标识。 }
        provider: { type: string, enum: [guest, password], description: 生产仅 password；guest 只供旧开发构造器。 }
        accountName: { type: string, minLength: 1, description: password 提供方必填账号，不是玩家标识。 }
        clientVersion: { type: string, description: 上游客户端版本；兼容旧内部调用可省略。 }
        credential: { type: string, minLength: 1, description: 上游传递的提供方凭据。 }
        deviceId: { type: string, description: 设备或安装实例标识；可为空字符串。 }
    InternalLoginResponse:
      type: object
      additionalProperties: false
      required: [playerId, sessionId, accessToken, refreshToken, expiresAtUnixMs, refreshExpiresAtUnixMs]
      properties:
        playerId: { type: string, description: 玩家标识。 }
        sessionId: { type: string, description: 在线会话标识。 }
        accessToken: { type: string, description: 短期访问令牌。 }
        refreshToken: { type: string, description: 刷新令牌。 }
        expiresAtUnixMs: { type: integer, format: int64, description: Access Token UTC 过期时间的 Unix 毫秒值。 }
        refreshExpiresAtUnixMs: { type: integer, format: int64, description: 刷新绝对期限，轮换不得延期。 }
    AuthenticateRequest:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken: { type: string, minLength: 1, description: 待验证的访问令牌。 }
    AuthenticateResponse:
      oneOf:
        - $ref: '#/components/schemas/AuthenticatedSession'
        - $ref: '#/components/schemas/InvalidSession'
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [valid, playerId, sessionId]
      properties:
        valid: { type: boolean, const: true, description: 令牌验证成功。 }
        playerId: { type: string, description: 已认证玩家标识。 }
        sessionId: { type: string, description: 已认证会话标识。 }
    InvalidSession:
      type: object
      additionalProperties: false
      required: [valid, errorCode]
      properties:
        valid: { type: boolean, const: false, description: 令牌无效或已过期。 }
        errorCode: { type: string, enum: [AUTH_SESSION_INVALID, AUTH_TOKEN_EXPIRED], description: 无效或过期会话的稳定错误码。 }
    InternalApiError:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      properties:
        errorCode: { type: string, description: 内部稳定错误码。 }
        message: { type: string, description: 错误说明，不应用于业务状态分支。 }
