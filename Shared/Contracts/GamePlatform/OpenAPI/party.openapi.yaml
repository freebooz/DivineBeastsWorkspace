openapi: 3.1.0
info:
  title: 游戏平台组队服务内部接口（Party API）
  version: 1.0.0
  description: MatchService（组队与匹配服务）内部HTTP契约。创建沿用旧快照；本人状态、邀请收件箱和普通命令沿用party-interaction.openapi.yaml中的授权DTO。内部端口仅允许可信服务网络访问，未新增服务间认证机制，不得直接暴露公网；源码注册不等于部署、并发或UE闭环验证通过。
servers:
  - url: http://127.0.0.1:8083
    description: 本地 Docker 开发部署的 MatchService
tags:
  - name: 运维
    description: 检查 MatchService 进程存活、服务宿主就绪和版本信息。
  - name: 内部组队
    description: 仅供 GatewayService 等可信后端使用的组队操作；玩家身份由已认证会话确定。
paths:
  /health/live:
    get:
      tags: [运维]
      operationId: getPartyLiveness
      summary: 查询组队与匹配服务进程存活状态
      responses:
        '200':
          description: 服务进程存活。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessResponse' }
  /health/ready:
    get:
      tags: [运维]
      operationId: getPartyReadiness
      summary: 查询组队与匹配服务宿主就绪状态
      responses:
        '200':
          description: 服务宿主已就绪。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
  /version:
    get:
      tags: [运维]
      operationId: getPartyVersion
      summary: 查询组队与匹配服务名称与版本
      responses:
        '200':
          description: 服务名称与运行版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /internal/v1/match/party:
    post:
      tags: [内部组队]
      operationId: createInternalParty
      summary: 为已认证玩家创建赛前队伍
      description: 仅 GatewayService 等可信内部调用方可使用。当前 Gateway 会从有效会话提取 playerId 后调用此接口，客户端不可自行指定权威玩家身份。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePartyRequest' }
      responses:
        '200':
          description: 队伍创建成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartySnapshot' }
        '400':
          description: 请求格式或领域规则无效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalApiError' }
  /internal/v1/match/party/state:
    post:
      tags: [内部组队]
      operationId: readInternalPartyState
      summary: 读取可信调用方提供主体的授权普通队伍快照
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyReadRequest' }
      responses:
        '200':
          description: 本人真实队伍状态；只有明确无队伍可返回hasParty为false。
          content:
            application/json:
              schema: { $ref: 'party-interaction.openapi.yaml#/components/schemas/PartySnapshot' }
        '400': { $ref: '#/components/responses/PartyInteractionError' }
        '503': { $ref: '#/components/responses/PartyInteractionError' }
  /internal/v1/match/party/invitations:
    post:
      tags: [内部组队]
      operationId: readInternalPartyInvitations
      summary: 读取可信主体的未到期邀请收件箱
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyReadRequest' }
      responses:
        '200':
          description: 最多20项本人授权邀请；不返回其他请求者或完整队伍。
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: 'party-interaction.openapi.yaml#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/PartyInteractionError' }
        '503': { $ref: '#/components/responses/PartyInteractionError' }
  /internal/v1/match/party/commands:
    post:
      tags: [内部组队]
      operationId: commandInternalParty
      summary: 在队伍事务中执行可信调用主体的普通命令
      description: playerId只由可信内部调用方传入，公网客户端不得提供。命令字段平铺于同一JSON对象；不包含小队准备会话或竞技入场确认命令。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [playerId, partyId, action, clientRequestId, expectedRevision]
              properties:
                playerId: { $ref: 'party-interaction.openapi.yaml#/components/schemas/Identifier' }
                partyId: { $ref: 'party-interaction.openapi.yaml#/components/schemas/Identifier' }
                action: { $ref: 'party-interaction.openapi.yaml#/components/schemas/PartyCommand/properties/action' }
                targetPlayerId: { $ref: 'party-interaction.openapi.yaml#/components/schemas/PartyCommand/properties/targetPlayerId' }
                membershipRequestId: { $ref: 'party-interaction.openapi.yaml#/components/schemas/PartyCommand/properties/membershipRequestId' }
                clientRequestId: { $ref: 'party-interaction.openapi.yaml#/components/schemas/Identifier' }
                expectedRevision: { $ref: 'party-interaction.openapi.yaml#/components/schemas/Revision' }
                ready: { $ref: 'party-interaction.openapi.yaml#/components/schemas/PartyCommand/properties/ready' }
      responses:
        '200':
          description: 原子提交或同主体同内容幂等重放后的授权结果。
          content:
            application/json:
              schema: { $ref: 'party-interaction.openapi.yaml#/components/schemas/CommandResult' }
        '400': { $ref: '#/components/responses/PartyInteractionError' }
        '403': { $ref: '#/components/responses/PartyInteractionError' }
        '404': { $ref: '#/components/responses/PartyInteractionError' }
        '409': { $ref: '#/components/responses/PartyInteractionError' }
        '429': { $ref: '#/components/responses/PartyInteractionError' }
        '503': { $ref: '#/components/responses/PartyInteractionError' }
components:
  responses:
    PartyInteractionError:
      description: 组队安全错误码；不透传存储地址、原始记录或认证敏感信息。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
  schemas:
    PartyReadRequest:
      type: object
      additionalProperties: false
      required: [playerId]
      properties:
        playerId: { $ref: 'party-interaction.openapi.yaml#/components/schemas/Identifier' }
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok, description: 存活状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ready, description: 就绪状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [service, version]
      properties:
        service: { type: string, description: 服务运行名称。 }
        version: { type: string, description: 服务构建版本。 }
    CreatePartyRequest:
      type: object
      additionalProperties: false
      required: [playerId]
      properties:
        playerId: { type: string, minLength: 1, description: 可信调用方已认证的玩家标识。 }
        displayName: { type: string, description: 创建时记录的显示名称；Gateway 当前传递空字符串。 }
    PartySnapshot:
      type: object
      additionalProperties: false
      required: [partyId, leaderPlayerId, memberPlayerIds, selectedArenaModeId, rosterLocked, revision]
      properties:
        partyId: { type: string, description: 队伍标识。 }
        leaderPlayerId: { type: string, description: 队长玩家标识。 }
        memberPlayerIds:
          type: array
          description: 不可拆分队伍成员标识列表，当前按字典序输出。
          items: { type: string }
        selectedArenaModeId: { type: string, description: 选择的竞技模式；未选择时为空字符串。 }
        rosterLocked: { type: boolean, description: 名单是否已锁定。 }
        revision: { type: integer, minimum: 0, description: 队伍修订号。 }
    InternalApiError:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      properties:
        errorCode: { type: string, description: 内部稳定错误码。 }
        message: { type: string, description: 错误说明。 }
