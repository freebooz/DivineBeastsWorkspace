openapi: 3.1.0
info:
  title: GamePlatform Party Internal API（游戏平台组队内部接口）
  version: 1.0.0
  description: MatchService 当前已注册的组队内部 HTTP 接口。该规格只描述创建队伍；邀请、加入、准备、转让队长、名单锁定和查询路由尚未在当前运行服务中注册。
servers:
  - url: http://127.0.0.1:8083
    description: 本地 Docker 开发部署的 MatchService
tags:
  - name: 运维
  - name: 内部组队
paths:
  /health/live:
    get:
      tags: [运维]
      operationId: getPartyLiveness
      summary: 查询 MatchService 存活状态
      responses:
        '200':
          description: 服务进程存活。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessResponse' }
  /health/ready:
    get:
      tags: [运维]
      operationId: getPartyReadiness
      summary: 查询 MatchService 就绪状态
      responses:
        '200':
          description: 服务宿主已就绪。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
  /version:
    get:
      tags: [运维]
      operationId: getPartyVersion
      summary: 查询 MatchService 版本
      responses:
        '200':
          description: 服务名称与运行版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /internal/v1/match/party:
    post:
      tags: [内部组队]
      operationId: createInternalParty
      summary: 为指定玩家创建队伍
      description: 仅 GatewayService 等可信内部调用方可使用。当前 Gateway 会从有效会话提取 playerId 后调用此接口，客户端不可自行指定权威玩家身份。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePartyRequest' }
      responses:
        '200':
          description: 队伍创建成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartySnapshot' }
        '400':
          description: 请求格式或领域规则无效。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalApiError' }
components:
  schemas:
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok, description: 存活状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ready, description: 就绪状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [service, version]
      properties:
        service: { type: string, description: 服务运行名称。 }
        version: { type: string, description: 服务构建版本。 }
    CreatePartyRequest:
      type: object
      additionalProperties: false
      required: [playerId]
      properties:
        playerId: { type: string, minLength: 1, description: 可信调用方已认证的玩家标识。 }
        displayName: { type: string, description: 创建时记录的显示名称；Gateway 当前传递空字符串。 }
    PartySnapshot:
      type: object
      additionalProperties: false
      required: [partyId, leaderPlayerId, memberPlayerIds, selectedArenaModeId, rosterLocked, revision]
      properties:
        partyId: { type: string, description: 队伍标识。 }
        leaderPlayerId: { type: string, description: 队长玩家标识。 }
        memberPlayerIds:
          type: array
          description: 不可拆分队伍成员标识列表，当前按字典序输出。
          items: { type: string }
        selectedArenaModeId: { type: string, description: 选择的竞技模式；未选择时为空字符串。 }
        rosterLocked: { type: boolean, description: 名单是否已锁定。 }
        revision: { type: integer, minimum: 0, description: 队伍修订号。 }
    InternalApiError:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      properties:
        errorCode: { type: string, description: 内部稳定错误码。 }
        message: { type: string, description: 错误说明。 }
