openapi: 3.1.0
info:
  title: 游戏平台统一接入接口（Gateway API）
  version: 1.0.0
  description: |
    GatewayService（统一接入服务）面向游戏客户端提供当前已注册并可运行的 HTTP 接口。本规格仅描述真实路由；身份、玩家资料、组队和匹配的内部接口分别见对应 OpenAPI 文件。
    响应会返回 X-Request-Id（请求追踪编号）和 X-Trace-Id（调用链追踪编号）；配置共享契约版本后还会返回 X-Contract-Version（契约版本）。这些请求标识用于诊断，不是认证凭据。
servers:
  - url: http://127.0.0.1:28080
    description: 本地 Docker 开发部署的 GatewayService
tags:
  - name: 依赖诊断
    description: 检查统一接入服务到身份与玩家资料服务的真实业务依赖；不能用进程存活或就绪检查替代。
  - name: 运维
    description: 检查 HTTP 进程存活、服务宿主就绪和版本信息；通过检查不代表所有业务依赖均可用。
  - name: 客户端业务
    description: 游戏客户端经 GatewayService（统一接入服务）调用的业务接口；需要身份验证的操作必须使用服务端签发的访问令牌。
paths:
  /v1/online/probe:
    get:
      tags: [依赖诊断]
      operationId: probeGatewayOnline
      summary: 检查身份与玩家资料的真实业务依赖
      description: 查询身份与玩家资料领域仓储的实际可用性；不检查 MatchService，也不以 HTTP 存活或就绪端点代替。依赖不可用时返回 503。
      responses:
        '200':
          description: 两个领域仓储均就绪。
          content:
            application/json:
              schema:
                type: object
                required: [ready, contractVersion, service]
                properties:
                  ready: {type: boolean, const: true}
                  contractVersion: {type: string, const: 1.0.0}
                  service: {type: string, const: gatewayservice}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/auth/refresh:
    post:
      tags: [客户端业务]
      operationId: refreshGatewayAuthentication
      summary: 轮换刷新令牌并签发新访问令牌
      description: 服务端原子消费旧刷新令牌并签发新令牌，不延长会话绝对期限。请求超时或响应丢失时不得盲目重试，因为旧令牌可能已经被消费。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: 轮换成功；旧刷新凭据不可重用，响应禁止缓存。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/auth/logout:
    post:
      tags: [客户端业务]
      operationId: logoutGatewayAuthentication
      summary: 撤销刷新令牌所属会话
      description: 使用当前或已消费的刷新令牌授权撤销同一会话；重复请求保持幂等。服务端不会依据客户端声明的玩家标识授权。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '204': {description: 服务端已撤销，无正文。}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /health/live:
    get:
      tags: [运维]
      operationId: getGatewayLiveness
      summary: 查询网关存活状态
      description: 仅表示 HTTP 进程存活，不代表下游依赖或业务请求已经就绪。
      responses:
        '200':
          description: 服务进程存活。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags: [运维]
      operationId: getGatewayReadiness
      summary: 查询网关就绪状态
      description: 本地装配的就绪端点；当前 ServiceHost 只检查服务宿主自身状态。
      responses:
        '200':
          description: 服务宿主已就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /version:
    get:
      tags: [运维]
      operationId: getGatewayVersion
      summary: 查询网关版本
      responses:
        '200':
          description: 服务名称与运行版本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /v1/auth/login:
    post:
      tags: [客户端业务]
      operationId: gatewayLogin
      summary: 玩家登录
      description: |
        Gateway 将登录请求转交 IdentityService（身份服务）。生产环境使用 password 提供方：accountName 表示账号名，credential 表示密码；guest 提供方仅为旧版开发装配保留，生产环境会拒绝该方式且不会降级。
        生产凭据校验、令牌轮换和撤销策略必须由生产身份服务实现；本地内存装配只用于开发联调，不能替代生产认证。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '400':
          description: JSON 格式错误或包含未知字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
        '401':
          description: 登录凭据无效或登录服务拒绝请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
  /v1/player/profile:
    patch:
      tags: [客户端业务]
      operationId: updateGatewayPlayerProfile
      summary: 修改本人显示名（身份从访问令牌解析）
      description: 仅允许修改显示名。服务端从 Bearer Access Token（访问令牌）解析玩家身份，不接受客户端提供的 playerId 或白名单之外的字段。调用方必须提供幂等键和预期修订号；修订冲突返回 409。
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 主体+操作+规范内容绑定；同键同体重放先于修订检查。
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, expectedRevision]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 24, description: 去除首尾空白后为 1 至 24 个 Unicode 字符。}
                expectedRevision: {type: integer, format: int64, minimum: 0, description: 客户端读取资料时获得的修订号；服务端用它检测并发修改。}
      responses:
        '200':
          description: 完整资料；同键同内容返回首次持久提交的结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlayerProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 资料不存在。}
        '409': {description: 修订或幂等内容冲突。}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [客户端业务]
      operationId: getGatewayPlayerProfile
      summary: 获取当前玩家资料
      description: 服务端从 Bearer Access Token（访问令牌）解析调用者身份后读取长期玩家资料；不接收客户端声明的 playerId。
      security:
        - bearerAuth: []
      responses:
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '200':
          description: 当前已认证玩家的长期资料。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '401':
          description: 缺少或无效的 Bearer Access Token。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
        '404':
          description: 玩家资料不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
  /v1/player/characters:
    get:
      tags: [客户端业务]
      operationId: listGatewayPlayerCharacters
      summary: 获取当前玩家的持久角色列表
      description: 服务端从 Bearer Access Token 解析玩家身份；客户端不得声明其他 playerId。
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 当前玩家拥有的持久角色列表；无角色时返回空数组。
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CharacterSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [客户端业务]
      operationId: createGatewayPlayerCharacter
      summary: 为当前玩家创建持久角色
      description: creationRequestId 是玩家作用域幂等键；同键同内容重放原结果，同键异内容返回409。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCharacterRequest'}
      responses:
        '200':
          description: 创建成功或幂等重放，返回权威角色摘要。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterSummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: 幂等内容、角色名称或领域规则冲突。}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/player/character-selection:
    post:
      tags: [客户端业务]
      operationId: selectGatewayPlayerCharacter
      summary: 权威确认当前玩家选择的持久角色
      description: selectionRequestId 是玩家作用域幂等键；服务端校验角色归属、状态和 expectedCharacterRevision 后更新 selectedCharacterId。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CharacterSelectionRequest'}
      responses:
        '200':
          description: 选择已提交或幂等重放。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CharacterSelectionResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: 角色不存在或不属于当前玩家。}
        '409': {description: 角色修订、状态或幂等内容冲突。}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/party:
    post:
      tags: [客户端业务]
      operationId: createGatewayParty
      summary: 为当前玩家创建赛前队伍
      description: 创建后将已认证玩家设为队长。当前实现不接收请求体，后续成员邀请、准备和名单锁定不是本地运行路由。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 队伍创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartySnapshot'
        '401':
          description: 缺少或无效的 Bearer Access Token。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
        '409':
          description: 队伍创建被领域规则拒绝。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
  /v1/matchmaking/tickets:
    post:
      tags: [客户端业务]
      operationId: createGatewayMatchmakingTicket
      summary: 创建匹配票据
      description: |
        为单人或不可拆分 Party 创建匹配票据。arenaModeId 必须是项目目录定义的 1v1、2v2、3v3、4v4 或 5v5 模式之一；队伍人数由模式定义确定，不从客户端推导。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchmakingTicketRequest'
      responses:
        '200':
          description: 匹配票据创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchmakingTicket'
        '400':
          description: JSON 格式错误或包含未知字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
        '401':
          description: 缺少或无效的 Bearer Access Token。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
        '409':
          description: 匹配票据被领域规则拒绝。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayApiError'
  /v1/divinebeasts/world-entry:
    post:
      tags: [客户端业务]
      operationId: enterDivineBeastsWorld
      summary: 为已认证玩家当前选中角色分配常驻世界并签发一次性迁移票据
      description: |
        服务端从Bearer Access Token解析PlayerID和SessionID，并核对当前玩家资料中的selectedCharacterId及角色修订号。
        客户端只能声明目标体验和首选区域，不能声明GameServer、PlayerID、SessionID或目标Endpoint。
        返回的transferTicket仅供GamePlatformSession一次性交给安全传输层，不得写入URL、日志或长期持久化。
        MainArena由MatchService比赛编排链路分配，不经过本接口。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DivineBeastsWorldEntryRequest'}
      responses:
        '200':
          description: 世界分配与一次性迁移材料签发成功；响应禁止缓存。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DivineBeastsWorldEntryResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: 玩家资料或角色不存在。}
        '409': {description: 当前角色选择、角色修订或目标世界分配发生冲突。}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  responses:
    InvalidRequest:
      description: 非法JSON、重复/未知字段、缺必填或越权输入。
      content: {application/json: {schema: {$ref: '#/components/schemas/GatewayApiError'}}}
    Unauthorized:
      description: 凭据无效、过期、撤销或刷新重放。
      content: {application/json: {schema: {$ref: '#/components/schemas/GatewayApiError'}}}
    Forbidden:
      description: 无权限；不应刷新重试。
      content: {application/json: {schema: {$ref: '#/components/schemas/GatewayApiError'}}}
    TooLarge:
      description: 请求正文超过65536字节。
      content: {application/json: {schema: {$ref: '#/components/schemas/GatewayApiError'}}}
    RateLimited:
      description: 登录与刷新共享每源IP限额，默认每分钟30次；不信任转发头。
      headers:
        Retry-After: {schema: {type: integer}, description: 等待秒数。}
      content: {application/json: {schema: {$ref: '#/components/schemas/GatewayApiError'}}}
    Unavailable:
      description: 下游或持久存储不可用；不泄漏地址、SQL和凭据，不冒充401。
      content: {application/json: {schema: {$ref: '#/components/schemas/GatewayApiError'}}}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
  schemas:
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 1, description: 仅通过正文传输，不放URL或日志。}
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
          description: 存活状态常量。
        service:
          type: string
          description: 服务运行名称。
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ready
          description: 就绪状态常量。
        service:
          type: string
          description: 服务运行名称。
    VersionResponse:
      type: object
      additionalProperties: false
      required: [service, version]
      properties:
        service:
          type: string
          description: 服务运行名称。
        version:
          type: string
          description: 服务构建版本；本地 Docker 部署使用 local。
    LoginRequest:
      type: object
      additionalProperties: false
      required: [gameId, provider, credential, clientVersion]
      properties:
        gameId:
          type: string
          minLength: 1
          description: 游戏逻辑标识，例如 divine-beasts。
        provider:
          type: string
          enum: [guest, password]
          description: 生产仅password；guest仅旧开发装配兼容。
        accountName:
          type: string
          minLength: 1
          description: password提供方必填；新增字段不替换原credential。
        credential:
          type: string
          minLength: 1
          description: 提供方凭据；生产环境的具体校验由身份服务负责。
        clientVersion:
          type: string
          minLength: 1
          description: 客户端构建版本，用于兼容性和诊断。
        deviceId:
          type: string
          description: 客户端设备或安装实例标识；未提供时传递为空字符串。
    LoginResponse:
      type: object
      additionalProperties: false
      required: [playerId, accessToken, refreshToken, expiresAt, sessionId, refreshExpiresAt]
      properties:
        refreshExpiresAt:
          type: string
          format: date-time
          description: 刷新凭据绝对到期UTC时间，轮换不延长会话期限。
        playerId:
          type: string
          description: 已认证玩家标识。
        accessToken:
          type: string
          description: 后续 Bearer 认证使用的短期访问令牌。
        refreshToken:
          type: string
          description: 刷新令牌；本地服务返回值不等同生产令牌安全策略。
        expiresAt:
          type: string
          format: date-time
          description: Access Token 的 UTC 过期时间。
        sessionId:
          type: string
          description: 在线会话标识。
    PlayerProfile:
      type: object
      additionalProperties: false
      required: [playerId, gameId, displayName, dataVersion, revision, tutorialCompleted, selectedCharacterId, ownedCharacterIds]
      properties:
        playerId:
          type: string
          description: 玩家标识。
        gameId:
          type: string
          description: 所属游戏标识。
        displayName:
          type: string
          description: 玩家显示名称。
        dataVersion:
          type: integer
          minimum: 1
          description: 玩家资料结构版本。
        revision:
          type: integer
          format: int64
          minimum: 0
          description: 长期资料的乐观并发修订号。
        tutorialCompleted:
          type: boolean
          description: 是否完成新手教学。
        defaultWorldId:
          type: string
          description: 默认进入的世界逻辑标识；当前实现可能为空字符串。
        selectedCharacterId:
          type: string
          description: 最近一次经服务端权威验证的持久角色；尚未选择时为空字符串。
        ownedCharacterIds:
          type: array
          description: 已拥有角色逻辑标识列表。
          items:
            type: string
    CharacterSummary:
      type: object
      additionalProperties: false
      required: [characterId, heroDefinitionId, characterName, characterRevision, onboardingState, status]
      properties:
        characterId: {type: string, minLength: 1, description: 持久角色唯一标识。}
        heroDefinitionId: {type: string, minLength: 1, description: 项目Hero Definition稳定标识。}
        characterName: {type: string, minLength: 1, maxLength: 24, description: 玩家可见角色名称。}
        characterRevision: {type: integer, format: int64, minimum: 1, description: 角色乐观并发修订号。}
        onboardingState:
          type: string
          enum: [New, TutorialRequired, TutorialInProgress, OnboardingComplete]
          description: 该角色的新手流程状态。
        status:
          type: string
          enum: [Active, Disabled]
          description: 角色是否允许继续选择进入游戏。
        appearanceProfileId:
          type: string
          description: 可选外观方案标识；为空表示使用默认外观。
    CreateCharacterRequest:
      type: object
      additionalProperties: false
      required: [creationRequestId, heroDefinitionId, characterName]
      properties:
        creationRequestId: {type: string, minLength: 1, maxLength: 128, description: 玩家作用域创建幂等键。}
        heroDefinitionId: {type: string, minLength: 1, description: 要创建的项目Hero Definition。}
        characterName: {type: string, minLength: 1, maxLength: 24, description: 去除首尾空白后的角色名称。}
        appearanceSelection:
          type: object
          additionalProperties: {type: string}
          description: 项目定义的外观选项键值；服务端只保存经过项目规则校验后的白名单值。
    CharacterSelectionRequest:
      type: object
      additionalProperties: false
      required: [selectionRequestId, characterId, expectedCharacterRevision]
      properties:
        selectionRequestId: {type: string, minLength: 1, maxLength: 128, description: 玩家作用域选择幂等键。}
        characterId: {type: string, minLength: 1, description: 目标持久角色标识。}
        expectedCharacterRevision: {type: integer, format: int64, minimum: 1, description: 客户端列表快照中的角色修订号。}
    CharacterSelectionResponse:
      type: object
      additionalProperties: false
      required: [selectionRequestId, profileRevision, character]
      properties:
        selectionRequestId: {type: string, description: 已提交的选择请求标识。}
        profileRevision: {type: integer, format: int64, minimum: 1, description: 更新 selectedCharacterId 后的玩家资料修订号。}
        character: {$ref: '#/components/schemas/CharacterSummary'}
    PartySnapshot:
      type: object
      additionalProperties: false
      required: [partyId, leaderPlayerId, memberPlayerIds, selectedArenaModeId, rosterLocked, revision]
      properties:
        partyId:
          type: string
          description: 队伍标识。
        leaderPlayerId:
          type: string
          description: 当前队长玩家标识。
        memberPlayerIds:
          type: array
          description: 不可拆分的队伍成员标识列表。
          items:
            type: string
        selectedArenaModeId:
          type: string
          description: 当前选择的竞技模式；尚未选择时为空字符串。
        rosterLocked:
          type: boolean
          description: 名单是否已锁定。
        revision:
          type: integer
          minimum: 0
          description: 队伍修订号。
    CreateMatchmakingTicketRequest:
      type: object
      additionalProperties: false
      required: [arenaModeId, clientRequestId]
      properties:
        arenaModeId:
          type: string
          enum: [Arena.Mode.Duel1v1, Arena.Mode.Team2v2, Arena.Mode.Team3v3, Arena.Mode.Team4v4, Arena.Mode.Team5v5]
          description: 项目定义的竞技模式标识。
        partyId:
          type: string
          description: 已有队伍标识；单人匹配时为空字符串。
        preferredRegion:
          type: string
          description: 首选匹配区域；服务端可按容量和规则调整。
        clientRequestId:
          type: string
          minLength: 1
          description: 客户端幂等请求标识。
    MatchmakingTicket:
      type: object
      additionalProperties: false
      required: [ticketId, arenaModeId, partyId, partyMemberIds, partySize, teamSize, state]
      properties:
        ticketId:
          type: string
          description: 匹配票据标识。
        arenaModeId:
          type: string
          description: 已接受的竞技模式标识。
        partyId:
          type: string
          description: 队伍标识；单人匹配时为空字符串。
        partyMemberIds:
          type: array
          minItems: 1
          maxItems: 5
          description: 匹配原子单元中的玩家标识列表。
          items:
            type: string
        partySize:
          type: integer
          minimum: 1
          maximum: 5
          description: 当前匹配原子单元人数。
        teamSize:
          type: integer
          minimum: 1
          maximum: 5
          description: 该竞技模式的单队人数。
        state:
          type: string
          enum: [searching, matchFound, canceled, failed]
          description: 匹配状态；当前创建成功后通常为 searching。
    DivineBeastsWorldEntryRequest:
      type: object
      additionalProperties: false
      required: [requestId, characterId, desiredExperienceId, expectedCharacterRevision]
      properties:
        requestId: {type: string, minLength: 1, maxLength: 128, description: 玩家作用域世界进入幂等请求标识，同时作为内部迁移票据请求关联标识。}
        characterId: {type: string, minLength: 1, description: 必须与当前玩家资料中服务端已确认的selectedCharacterId一致。}
        desiredExperienceId:
          type: string
          enum: [Experience.OpenWorld.Hub, Experience.OpenWorld.Main, Experience.Lobby.Main, Experience.Village.Main, Experience.Village.Tutorial, Experience.Village.Training]
          description: 常驻世界目标体验；MainArena不使用本接口。
        expectedCharacterRevision: {type: integer, format: int64, minimum: 1, description: 客户端角色列表快照中的修订号。}
        preferredRegion: {type: string, description: 可选首选区域；为空时使用服务端部署默认区域。}
    DivineBeastsWorldEntryResponse:
      type: object
      additionalProperties: false
      required: [assignmentId, gameServerId, serverRoleId, experienceId, worldId, mapId, regionId, ticketId, characterId, sessionId, gameSessionId, serverBootId, protocolVersion, sessionEpoch, endpoint, transferTicket]
      properties:
        assignmentId: {type: string, minLength: 1, description: GameServerControl签发的目标Assignment身份。}
        gameServerId: {type: string, minLength: 1, description: 目标Dedicated Server实例身份。}
        serverRoleId: {type: string, enum: [GameServer.Role.OpenWorld, GameServer.Role.Village], description: 常驻世界正式服务器角色。}
        experienceId: {type: string, minLength: 1, description: 已接受的目标体验。}
        worldId: {type: string, minLength: 1, description: 目标世界逻辑身份。}
        mapId: {type: string, minLength: 1, description: 当前阶段与worldId相同的逻辑地图标识；真实磁盘地图由WorldDefinition解析。}
        regionId: {type: string, minLength: 1, description: 实际分配区域。}
        ticketId: {type: string, minLength: 1, description: 一次性迁移票据标识。}
        characterId: {type: string, minLength: 1, description: 服务端已核对的当前角色。}
        sessionId: {type: string, minLength: 1, description: 从Bearer会话解析的在线Session身份。}
        gameSessionId: {type: string, minLength: 1, description: 控制面签发的游戏会话绑定身份；非凭据，可用于客户端与服务端绑定核对。}
        serverBootId: {type: string, minLength: 1, description: 目标Dedicated Server当前启动代次；服务器重启后旧值必须失效。}
        protocolVersion: {type: integer, format: int32, minimum: 1, description: 目标Dedicated Server实时网络协议版本。}
        sessionEpoch: {type: integer, format: int64, minimum: 1, description: 当前在线Session的单调权威绑定代次。}
        endpoint: {type: string, minLength: 1, description: 目标GameServer连接端点；不得包含凭据。}
        transferTicket: {type: string, minLength: 1, description: JSON序列化的一次性签名迁移票据；不得进入URL、日志或持久化。}
    GatewayApiError:
      type: object
      additionalProperties: false
      required: [errorCode, message, retryable]
      properties:
        errorCode:
          type: string
          description: 稳定的业务或传输错误码。
        message:
          type: string
          description: 面向调用方的错误说明；不得据此解析业务状态。
        retryable:
          type: boolean
          description: 当前 Gateway 实现固定返回 false。
