openapi: 3.1.0
info:
  title: GamePlatform Player Data Internal API（游戏平台玩家资料内部接口）
  version: 1.0.0
  description: PlayerDataService 当前运行的内部 HTTP 接口。该服务只保存跨局长期资料，不承载生命值、Buff、技能冷却等实时战斗状态；调用者必须是受信任的后端服务。
servers:
  - url: http://127.0.0.1:8082
    description: 本地 Docker 开发部署的 PlayerDataService
tags:
  - name: 运维
  - name: 内部玩家资料
paths:
  /internal/v1/playerdata/probe:
    get:
      tags: [内部玩家资料]
      operationId: probePlayerDataInternal
      summary: 通过资料仓储实际检查数据库可用性
      responses:
        '200':
          description: 真实领域 Probe 成功，不是宿主 health/ready。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /internal/v1/playerdata/ensure:
    post:
      tags: [内部玩家资料]
      operationId: ensurePlayerProfileInternal
      summary: 密码认证成功后幂等初始化所属玩家资料
      description: 仅由可信网关传入已认证身份；存在不同 gameId 的资料时拒绝，不能覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsureProfileRequest' }
      responses:
        '204': { description: 资料已存在或初始化成功，无正文。 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /health/live:
    get:
      tags: [运维]
      operationId: getPlayerDataLiveness
      summary: 查询玩家资料服务存活状态
      responses:
        '200':
          description: 服务进程存活。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivenessResponse' }
  /health/ready:
    get:
      tags: [运维]
      operationId: getPlayerDataReadiness
      summary: 查询玩家资料服务就绪状态
      responses:
        '200':
          description: 服务宿主已就绪。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
  /version:
    get:
      tags: [运维]
      operationId: getPlayerDataVersion
      summary: 查询玩家资料服务版本
      responses:
        '200':
          description: 服务名称与运行版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /internal/v1/playerdata/profile:
    patch:
      tags: [内部玩家资料]
      operationId: updateInternalPlayerProfile
      summary: 幂等修改显示名并检查预期修订号
      description: playerId 必须取自已认证主体。只允许显示名；重放同键同载荷返回原结果，同键异载荷或修订冲突返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: 已持久化的完整资料或幂等重放结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalPlayerProfileResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [内部玩家资料]
      operationId: getInternalPlayerProfile
      summary: 按玩家标识读取长期资料
      description: GatewayService 已完成身份认证后调用。playerId 由可信服务传入，不能接受游戏客户端直接调用。
      parameters:
        - name: playerId
          in: query
          required: true
          description: 要读取的玩家标识。
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: 已找到的玩家长期资料。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalPlayerProfileResponse' }
        '404':
          description: 玩家资料不存在。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalApiError' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  responses:
    InvalidRequest:
      description: 必填字段或白名单校验失败。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
    NotFound:
      description: 玩家资料不存在。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
    Conflict:
      description: 修订号、幂等键载荷或游戏归属冲突。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
    Unavailable:
      description: 数据库或领域不可用，不泄露内部错误。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InternalApiError' }
  schemas:
    ProbeResponse:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready: { type: boolean, const: true, description: 真实数据库探测通过。 }
    EnsureProfileRequest:
      type: object
      additionalProperties: false
      required: [playerId, gameId]
      properties:
        playerId: { type: string, minLength: 1, description: 认证所得玩家标识。 }
        gameId: { type: string, minLength: 1, description: 认证账号所属游戏。 }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [playerId, displayName, expectedRevision, idempotencyKey]
      properties:
        playerId: { type: string, minLength: 1, description: 认证所得玩家标识。 }
        displayName: { type: string, minLength: 1, maxLength: 24, description: 去除首尾空白后的 Unicode 显示名。 }
        expectedRevision: { type: integer, format: int64, minimum: 0, description: 非空必填，零不能当成省略。 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, description: 玩家作用域幂等键。 }
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok, description: 存活状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ready, description: 就绪状态常量。 }
        service: { type: string, description: 服务运行名称。 }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [service, version]
      properties:
        service: { type: string, description: 服务运行名称。 }
        version: { type: string, description: 服务构建版本。 }
    InternalPlayerProfileResponse:
      type: object
      additionalProperties: false
      required: [found, playerId, gameId, displayName, dataVersion, revision, tutorialCompleted, ownedCharacterIds]
      properties:
        found: { type: boolean, const: true, description: 当前 HTTP 实现仅在找到资料时返回 true。 }
        playerId: { type: string, description: 玩家标识。 }
        gameId: { type: string, description: 所属游戏标识。 }
        displayName: { type: string, description: 玩家显示名称。 }
        dataVersion: { type: integer, minimum: 1, description: 资料结构版本。 }
        revision: { type: integer, format: int64, minimum: 0, description: 长期资料乐观并发修订号。 }
        tutorialCompleted: { type: boolean, description: 是否完成新手教学。 }
        defaultWorldId: { type: string, description: 默认进入世界标识；当前实现可能为空字符串。 }
        ownedCharacterIds:
          type: array
          description: 已拥有角色逻辑标识列表。
          items: { type: string }
    InternalApiError:
      type: object
      additionalProperties: false
      required: [errorCode, message]
      properties:
        errorCode: { type: string, description: 内部稳定错误码。 }
        message: { type: string, description: 错误说明。 }
