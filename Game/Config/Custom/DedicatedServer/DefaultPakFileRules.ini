; 专用服务器发布包规则：由Server Target的CustomConfig构建收据选择。
; 适用于三种服务器角色，排除不参与服务器装配的纯客户端插件目录。
; 不改变地图选择、权威动画、Gameplay定义或客户端发布包。
; 回退时恢复Server Target的CustomConfig与本文件后重新构建、打包；不修改旧包。
[ExcludeProjectClientPresentationFromDedicatedServer]
bExcludeFromPaks=true
bOverrideChunkManifest=true
+Files=".../Plugins/DivineBeasts/DBAClient/..."
+Files=".../Plugins/DivineBeasts/ContentPacks/Presentation/DBAUIPack_Core/..."
+Files=".../Plugins/DivineBeasts/ContentPacks/Presentation/DBAFrontEndPack/..."
+Files=".../Plugins/GamePlatform/Presentation/GamePlatformVFX/..."
+Files=".../Plugins/GamePlatform/Presentation/GamePlatformSurface/..."
; 英雄包同时拥有服务器玩法数据；仅排除其UI/Abilities纯客户端目录，不能排除整个英雄包。
+Files=".../Plugins/DivineBeasts/ContentPacks/Heroes/DBAHeroPack_*/Content/UI/Abilities/..."
