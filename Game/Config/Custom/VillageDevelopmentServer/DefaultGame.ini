; 用户批准的生肖候选开发验证，仅在此CustomConfig与-DBADevelopmentSkills同时启用。
; 不修改正式英雄DefaultAbilitySetId；Shipping/Test始终拒绝开发集合。
[DivineBeasts.Abilities]
bAllowDevelopmentAbilitySets=true

[DivineBeasts.Abilities.DevelopmentSets]
Hero.Zodiac.Boar=dba.abilityset.boar_dev@1
Hero.Zodiac.Dog=dba.abilityset.dog_dev@1
Hero.Zodiac.Dragon=dba.abilityset.dragon_dev@1
Hero.Zodiac.Goat=dba.abilityset.goat_dev@1
Hero.Zodiac.Horse=dba.abilityset.horse_dev@1
Hero.Zodiac.Monkey=dba.abilityset.monkey_dev@1
Hero.Zodiac.Ox=dba.abilityset.ox_dev@1
Hero.Zodiac.Rabbit=dba.abilityset.rabbit_dev@1
Hero.Zodiac.Rat=dba.abilityset.rat_dev@1
Hero.Zodiac.Rooster=dba.abilityset.rooster_dev@1
Hero.Zodiac.Snake=dba.abilityset.snake_dev@1
Hero.Zodiac.Tiger=dba.abilityset.tiger_dev@1

[/Script/UnrealEd.ProjectPackagingSettings]
; 专服开发配置仍不烘焙客户端登录关卡和Widget资源，不能因开启开发技能改变三层端侧边界。
+DirectoriesToNeverCook=(Path="/DBAUIPack_Core")
+DirectoriesToNeverCook=(Path="/DBAFrontEndPack")
-DirectoriesToNeverCook=(Path="/Game/Development/DivineBeasts/Abilities")
+DirectoriesToAlwaysCook=(Path="/Game/Development/DivineBeasts/Abilities")
+DirectoriesToAlwaysCook=(Path="/DBAWorldPack_Village")
+MapsToCook=(FilePath="/DBAWorldPack_Village/Maps/L_Village_Start")

