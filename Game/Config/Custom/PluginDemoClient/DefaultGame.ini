; 仅供显式-DBAPluginDemo及-CustomConfig=PluginDemoClient的开发Client Cook，不进入正式发行。
; 生产DefaultGame.ini仍拒绝开发总览资源；开发配置只精确撤销本任务专用目录和两个样板场景的禁入。
[/Script/UnrealEd.ProjectPackagingSettings]
; 演示编目现显式引用Foundation内的SFX核验关卡及PCG软资源；仅本开发配置撤销父目录禁入。
; 实际地图仍由已校验Manifest白名单决定，不启用CookAll，不改变正式发行排除。
-DirectoriesToNeverCook=(Path="/Game/Development/Foundation")
; 新页面、目录与参数条目都归项目UI内容包；只有显式开发Client配置撤销禁入。
-DirectoriesToNeverCook=(Path="/DBAUIPack_Core/Development/PluginDemos")
+DirectoriesToAlwaysCook=(Path="/DBAUIPack_Core/Development/PluginDemos")
-DirectoriesToNeverCook=(Path="/Game/Development/PluginDemos")
+DirectoriesToAlwaysCook=(Path="/Game/Development/PluginDemos")
-DirectoriesToNeverCook=(Path="/Game/Development/BirdFlock")
+DirectoriesToAlwaysCook=(Path="/Game/Development/BirdFlock/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/Development/Weather/Maps")
; 插件演示专用客户端需要SurfaceMarks软目录、母材质、五类MI和纹理；不改变正式发布。
+DirectoriesToAlwaysCook=(Path="/GamePlatformSurface/Marks")
; 仅允许演示Manifest引用的地形审核材质；供应商样例与鸟历史仍禁止。
-DirectoriesToNeverCook=(Path="/DBAWorldPack_Village/Development/Terrain")
