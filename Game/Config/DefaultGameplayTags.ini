; 明确启用项目Config/Tags及本文件标签导入；各插件仍须登记自己的搜索路径。
; 客户端/服务器标签字典尚未完成烘焙一致性验收，暂不按共享索引快速复制。
[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
FastReplication=False
; 与Shared的三角色身份一致；大厅、教学、训练均不是新增服务器角色。
+GameplayTagList=(Tag="GameServer.Role.OpenWorld",DevComment="常驻世界服务器：大厅、主城、开放世界")
+GameplayTagList=(Tag="GameServer.Role.Village",DevComment="新手村服务器：教学与训练属于体验")
+GameplayTagList=(Tag="GameServer.Role.MainArena",DevComment="统一主竞技场服务器：支持1v1至5v5")
; Presentation自动化测试使用配置标签，禁止在ClientOnly模块声明Native GameplayTag导致客户端/服务器标签字典不一致。
+GameplayTagList=(Tag="Presentation.Test",DevComment="平台表现目录自动化测试父标签")
+GameplayTagList=(Tag="Presentation.Test.Child",DevComment="平台表现目录自动化测试子标签")
; 天气表现客户端只查询配置标签，不在ClientOnly模块注册Native GameplayTag。
