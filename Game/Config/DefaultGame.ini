+DirectoriesToNeverCook=(Path="/Game/Development/Foundation")
; 单英雄技能示例只用于Editor验证，不能随正式Client/Server Cook进入发布包。
+DirectoriesToNeverCook=(Path="/Game/Development/DivineBeasts/Abilities")
; Village WorldDefinition属于客户端流程解析和服务器身份校验共同依赖的小型项目定义资产；
