+DirectoriesToAlwaysCook=(Path="/DBAWorldPack_Village/Definitions")
; 双端技能逻辑定义、AbilitySet（授权集合）与数值表缺少地图硬引用时仍需真实Cook；
; 本目录必须只容纳服务器安全资产。不能把图标、Widget、Niagara或音频置入此目录。
+DirectoriesToAlwaysCook=(Path="/DBAGameplay/Abilities")

