name: divinebeasts-backend-local

services:
  identityservice:
    build:
      context: .
      dockerfile: Deploy/Docker/Backend.Dockerfile
      args:
        SERVICE: identityservice
    restart: unless-stopped
    environment:
      SERVICE_NAME: IdentityService
      SERVICE_PORT: "8081"
      GRPC_PORT: "9081"
      SERVICE_VERSION: local
      SHUTDOWN_TIMEOUT: 15s
      # 本地开发可选密码账号；为空时Identity保持游客开发模式，不影响生产装配。
      DIVINEBEASTS_DEV_LOGIN_USER: ${DIVINEBEASTS_DEV_LOGIN_USER:-}
      DIVINEBEASTS_DEV_LOGIN_PASSWORD: ${DIVINEBEASTS_DEV_LOGIN_PASSWORD:-}
      # 可选JSON数组：accountName/password；最多32个本地内存测试账号，不输出内容、不用于生产。
      DIVINEBEASTS_DEV_LOGIN_ACCOUNTS_JSON: ${DIVINEBEASTS_DEV_LOGIN_ACCOUNTS_JSON:-}
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT:-8081}:8081"
    networks:
      - backend

  playerdataservice:
    build:
      context: .
      dockerfile: Deploy/Docker/Backend.Dockerfile
      args:
        SERVICE: playerdataservice
    restart: unless-stopped
    environment:
      SERVICE_NAME: PlayerDataService
      SERVICE_PORT: "8082"
      GRPC_PORT: "9082"
      SERVICE_VERSION: local
      SHUTDOWN_TIMEOUT: 15s
    ports:
      - "127.0.0.1:${PLAYER_DATA_HOST_PORT:-8082}:8082"
    networks:
      - backend

  matchservice:
    build:
      context: .
      dockerfile: Deploy/Docker/Backend.Dockerfile
      args:
        SERVICE: matchservice
    restart: unless-stopped
    environment:
      SERVICE_NAME: MatchService
      SERVICE_PORT: "8083"
      GRPC_PORT: "9083"
      SERVICE_VERSION: local
      SHUTDOWN_TIMEOUT: 15s
    ports:
      - "127.0.0.1:${MATCH_HOST_PORT:-8083}:8083"
    networks:
      - backend

  gameservercontrolservice:
    build:
      context: .
      dockerfile: Deploy/Docker/Backend.Dockerfile
      args:
        SERVICE: gameservercontrolservice
    restart: unless-stopped
    environment:
      SERVICE_NAME: GameServerControlService
      SERVICE_PORT: "8084"
      GRPC_PORT: "9084"
      SERVICE_VERSION: local
      SHUTDOWN_TIMEOUT: 15s
      GAMESERVERCONTROL_INTERNAL_TOKEN: ${GAMESERVERCONTROL_INTERNAL_TOKEN:?required}
    ports:
      - "127.0.0.1:${GAMESERVER_CONTROL_HOST_PORT:-8084}:8084"
    networks:
      - backend

  gatewayservice:
    build:
      context: .
      dockerfile: Deploy/Docker/Backend.Dockerfile
      args:
        SERVICE: gatewayservice
    restart: unless-stopped
    depends_on:
      - identityservice
      - playerdataservice
      - matchservice
      - gameservercontrolservice
    environment:
      SERVICE_NAME: GatewayService
      SERVICE_PORT: "8080"
      GRPC_PORT: "9080"
      SERVICE_VERSION: local
      SHUTDOWN_TIMEOUT: 15s
      IDENTITY_SERVICE_URL: http://identityservice:8081
      PLAYER_DATA_SERVICE_URL: http://playerdataservice:8082
      MATCH_SERVICE_URL: http://matchservice:8083
      GAMESERVERCONTROL_SERVICE_URL: http://gameservercontrolservice:8084
      GAMESERVERCONTROL_INTERNAL_TOKEN: ${GAMESERVERCONTROL_INTERNAL_TOKEN:?required}
      DIVINEBEASTS_SWAGGER_CONTRACTS_ROOT: /contracts
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-28080}:8080"
    volumes:
      - ./Shared/Contracts:/contracts:ro
    networks:
      - backend

networks:
  backend:
    name: divinebeasts-backend-local
