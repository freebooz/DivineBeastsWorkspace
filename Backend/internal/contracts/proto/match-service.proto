syntax = "proto3";

package divinebeasts.backend.match.v1;

option go_package = "divinebeasts/backend/internal/generated/match/v1;matchv1";

// MatchService（比赛组织内部服务）供Gateway执行Party与Matchmaking业务操作。
service MatchService {
  rpc CreateParty(CreatePartyRequest) returns (CreatePartyResponse);
  rpc CreateMatchmakingTicket(CreateMatchmakingTicketRequest) returns (CreateMatchmakingTicketResponse);
  // 普通组队交互复用Shared定义的JSON对象，内部Envelope不再维护第二套字段编号映射。
  rpc ReadPartyState(PartyReadRequest) returns (PartyDataResponse);
  rpc CommandParty(PartyCommandRequest) returns (PartyDataResponse);
  rpc GetPartyInvitations(PartyReadRequest) returns (PartyDataResponse);
  // 本人可恢复事件观察；至多20秒阻塞等待，取消不回滚业务。
  rpc ObserveParty(PartyObservationRequest) returns (PartyDataResponse);
  // 匹配生命周期复用Shared JSON合同；认证主体/会话/已选角色由可信Gateway注入。
  rpc ReadMatchmakingState(PartyReadRequest) returns (PartyDataResponse);
  rpc ObserveMatchmaking(PartyObservationRequest) returns (PartyDataResponse);
  rpc CommandMatchmaking(MatchmakingCommandRequest) returns (PartyDataResponse);
  rpc GetMatchmakingMigration(MatchmakingCommandRequest) returns (PartyDataResponse);
}

message CreatePartyRequest {
  string player_id = 1;
}

message CreatePartyResponse {
  string party_id = 1;
  string leader_player_id = 2;
  repeated string member_player_ids = 3;
  string selected_arena_mode_id = 4;
  bool roster_locked = 5;
  int64 revision = 6;
  string error_code = 7;
}

message CreateMatchmakingTicketRequest {
  string player_id = 1;
  string arena_mode_id = 2;
  string party_id = 3;
  string preferred_region = 4;
  string client_request_id = 5;
}

message CreateMatchmakingTicketResponse {
  string ticket_id = 1;
  string arena_mode_id = 2;
  string party_id = 3;
  repeated string party_member_ids = 4;
  uint32 party_size = 5;
  uint32 team_size = 6;
  string state = 7;
  string error_code = 8;
}

// PartyReadRequest由可信Gateway生成；客户端不得直接连接内部服务或自行提交player_id。
message PartyReadRequest { string player_id = 1; }

// 仅可信Gateway填写主体，游标和等待期限来自Shared观察合同。
message PartyObservationRequest {
  string player_id = 1;
  string cursor = 2;
  int64 wait_milliseconds = 3;
}

// actor_json仅供内部服务，禁止客户端覆盖其中会话/角色；command_json由Shared公开合同拥有。
message MatchmakingCommandRequest {
  string actor_json = 1;
  string command_json = 2;
}

// PartyCommandRequest内command_json必须通过与公网相同的严格64KiB对象解码；不含认证材料。
message PartyCommandRequest {
  string player_id = 1;
  string command_json = 2;
}

// PartyDataResponse的JSON对象由Shared/Contracts/GamePlatform/OpenAPI/party-interaction.openapi.yaml拥有。
// error_code仅传白名单稳定码；成功与失败不得同时承载JSON和错误，空JSON不代表成功。
message PartyDataResponse {
  string payload_json = 1;
  string error_code = 2;
}
